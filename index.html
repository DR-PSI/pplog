  /* ---------------- bar chart (vanilla svg) ---------------- */
  function barChart(data, opts) {
    opts = opts || {};
    var W = 400, H = 220, padL = 34, padB = 22, padT = 8, padR = 6;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var max = Math.max.apply(null, data.map(function (d) { return d.kwh; })) || 1;
    var n = data.length;
    var gap = 4;
    var barW = Math.max(2, innerW / n - gap);

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: "220" });

    // gridlines
    for (var g = 0; g <= 3; g++) {
      var gy = padT + (innerH * g) / 3;
      s.appendChild(svg("line", { x1: padL, y1: gy, x2: W - padR, y2: gy, stroke: T.line, "stroke-width": 1 }));
      var gv = (max * (3 - g)) / 3;
      s.appendChild(svg("text", { x: padL - 6, y: gy + 3, "text-anchor": "end", "font-size": 9, fill: T.dim2, "font-family": "Inter" }, gv.toFixed(gv < 10 ? 1 : 0)));
    }

    var tooltipLayer = svg("g", { "pointer-events": "none" });
    var selectedIndex = null;
    var rects = [];

    function clearTooltip() {
      while (tooltipLayer.firstChild) tooltipLayer.removeChild(tooltipLayer.firstChild);
    }

    function paintTooltip(i) {
      clearTooltip();
      rects.forEach(function (r, ri) { r.setAttribute("fill", ri === i ? T.amber : T.orange); });
      if (i === null) return;
      var d = data[i];
      var x = padL + i * (innerW / n) + gap / 2;
      var barH = (d.kwh / max) * innerH;
      var barCenterX = x + barW / 2;
      var text = d.label + " · " + d.kwh + " kWh";
      var estW = Math.min(innerW, text.length * 5.3 + 16);
      var boxH = 20;
      var boxX = Math.min(Math.max(barCenterX - estW / 2, padL), W - padR - estW);
      var boxY = Math.max(padT, padT + innerH - barH - boxH - 8);
      tooltipLayer.appendChild(svg("rect", { x: boxX, y: boxY, width: estW, height: boxH, rx: 5, fill: T.surface2, stroke: T.orangeDeep, "stroke-width": 1 }));
      tooltipLayer.appendChild(svg("text", {
        x: boxX + estW / 2, y: boxY + boxH / 2 + 3.5, "text-anchor": "middle",
        "font-size": 9.5, "font-family": "'JetBrains Mono', monospace", fill: T.amber, "font-weight": 700,
      }, text));
    }

    data.forEach(function (d, i) {
      var x = padL + i * (innerW / n) + gap / 2;
      var barH = (d.kwh / max) * innerH;
      var y = padT + innerH - barH;
      var bottom = padT + innerH;

      var rect = svg("rect", { x: x, y: bottom, width: barW, height: 0, rx: 2, fill: T.orange, "pointer-events": "none" });
      var delay = Math.min(i * 0.014, 0.35) + "s";
      rect.appendChild(svg("animate", {
        attributeName: "height", from: 0, to: Math.max(0, barH), dur: "0.5s", begin: delay,
        fill: "freeze", calcMode: "spline", keySplines: "0.16 0.84 0.44 1", keyTimes: "0;1",
      }));
      rect.appendChild(svg("animate", {
        attributeName: "y", from: bottom, to: y, dur: "0.5s", begin: delay,
        fill: "freeze", calcMode: "spline", keySplines: "0.16 0.84 0.44 1", keyTimes: "0;1",
      }));
      rects.push(rect);

      // Full-column invisible hit target — much easier to tap than a short bar on a real touchscreen.
      var hit = svg("rect", {
        x: x, y: padT, width: barW, height: innerH, fill: "transparent",
        style: "cursor:pointer; touch-action:manipulation;",
      });
      var title = svg("title", {}, []);
      title.textContent = d.label + " — " + d.kwh + " kWh";
      hit.appendChild(title);
      var lastTapAt = 0;
      var handleTap = function (e) {
        var now = Date.now();
        if (now - lastTapAt < 400) return; // ignore the synthetic click that follows touchend
        lastTapAt = now;
        e.stopPropagation();
        if (e.cancelable) e.preventDefault();
        selectedIndex = selectedIndex === i ? null : i;
        paintTooltip(selectedIndex);
      };
      hit.addEventListener("touchend", handleTap);
      hit.addEventListener("click", handleTap);

      s.appendChild(hit);
      s.appendChild(rect);
      var everyN = opts.labelEvery || 1;
      if (i % everyN === 0) {
        s.appendChild(svg("text", {
          x: x + barW / 2, y: H - 6, "text-anchor": "middle", "font-size": 8.5, fill: T.dim2, "font-family": "Inter",
        }, d.label));
      }
    });

    s.appendChild(tooltipLayer);
    return s;
  }

  /* ---------------- mesh background ---------------- */
  function meshBackground(seed) {
    var W = 400, H = 760;
    var mesh = genMesh(seed, W, H, 24);
    var s = svg("svg", {
      viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none",
      style: "position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;",
    });
    var defs = svg("defs", {});
    var filter = svg("filter", { id: "ieGlow", x: "-200%", y: "-200%", width: "500%", height: "500%" });
    filter.appendChild(svg("feGaussianBlur", { stdDeviation: 2.4 }));
    defs.appendChild(filter);
    var grad = svg("linearGradient", { id: "ieLine", x1: 0, y1: 0, x2: 1, y2: 1 });
    grad.appendChild(svg("stop", { offset: "0%", "stop-color": T.amber }));
    grad.appendChild(svg("stop", { offset: "100%", "stop-color": T.orange }));
    defs.appendChild(grad);

    });
    mesh.pts.forEach(function (p, i) {
      var delay = (i * 0.13) + "s";
      var glow = svg("circle", { cx: p.x, cy: p.y, r: 4, fill: T.orange, "fill-opacity": 0.35, filter: "url(#ieGlow)" });
      glow.appendChild(svg("animate", { attributeName: "r", values: "3.5;6.5;3.5", dur: "3.4s", begin: delay, repeatCount: "indefinite" }));
      glow.appendChild(svg("animate", { attributeName: "fill-opacity", values: "0.22;0.55;0.22", dur: "3.4s", begin: delay, repeatCount: "indefinite" }));
      s.appendChild(glow);
      var core = svg("circle", { cx: p.x, cy: p.y, r: 1.1, fill: T.amber, "fill-opacity": 0.7 });
      core.appendChild(svg("animate", { attributeName: "fill-opacity", values: "0.45;1;0.45", dur: "3.4s", begin: delay, repeatCount: "indefinite" }));
      s.appendChild(core);
    });
    return s;
  }

    card.appendChild(glyphRow);
    card.appendChild(el("div", { text: "ปิดวงจร " + breaker.name + "?", style: { color: T.text, fontFamily: "'Space Grotesk', sans-serif", fontWeight: "700", fontSize: "16px", marginBottom: "6px" } }));
    card.appendChild(el("div", { text: "อุปกรณ์ในวงจรนี้จะตัดไฟทันที กรุณายืนยันว่าต้องการปิดวงจรนี้จริง", style: { color: T.dim, fontSize: "12.5px", lineHeight: "1.5", marginBottom: "18px" } }));
    var btnRow = el("div", { style: { display: "flex", gap: "10px" } });
    btnRow.appendChild(el("button", {
      text: "ยกเลิก",
      style: { flex: "1", padding: "11px 0", borderRadius: "12px", border: "1px solid " + T.line, background: "transparent", color: T.dim, fontFamily: "'Inter', sans-serif", fontWeight: "600", fontSize: "13.5px", cursor: "pointer" },
      onclick: function () { setState({ confirmId: null }); },
    }));
    btnRow.appendChild(el("button", {
      text: "ปิดวงจร",
      style: { flex: "1", padding: "11px 0", borderRadius: "12px", border: "none", background: T.danger, color: "#2A0A0A", fontFamily: "'Inter', sans-serif", fontWeight: "700", fontSize: "13.5px", cursor: "pointer" },
      onclick: function () {
        var id = breaker.id;
        state.status[id] = !state.status[id];
        setState({ confirmId: null });
      },
    }));
    card.appendChild(btnRow);
    overlay.appendChild(card);
    return overlay;
  }

  function requestToggle(id) {
    if (state.status[id]) {
      setState({ confirmId: id });
    } else {
      state.status[id] = true;
      render();
    }
  }

  /* ---------------- root render ---------------- */
  function render() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    pendingAnims = [];
    var container = el("div", {
      style: {
        maxWidth: "400px", margin: "0 auto", minHeight: "640px", backgroundColor: T.bg,
        fontFamily: "'Inter', sans-serif", borderRadius: "22px", overflow: "hidden",
        boxShadow: "0 20px 60px rgba(0,0,0,0.35)", position: "relative",
      },
    });
    container.appendChild(meshBackground(7));
    var content = el("div", { style: { position: "relative", zIndex: "1" } });
    content.appendChild(state.screen === "home" ? renderHome() : renderDetail());
    container.appendChild(content);
    if (state.confirmId) container.appendChild(renderConfirmDialog());
    root.appendChild(container);
    pendingAnims.forEach(function (a) { animateNumber(a.el, a.to, a.decimals); });
  }

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
</script>
</body>
